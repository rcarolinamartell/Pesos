<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pesos"><meta name="theme-color" content="#2f6fed"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Peso Converter</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f6f4f0;color:#222;margin:0;display:flex;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 24px #0001;padding:28px;max-width:420px;width:100%}
h1{font-size:20px;margin:0 0 4px}.sub{color:#888;font-size:13px;margin-bottom:20px}
.row{display:flex;gap:8px;align-items:center}
input{flex:1;font-size:28px;padding:12px 14px;border:1px solid #ddd;border-radius:12px;min-width:0}
button.mic{font-size:26px;width:60px;height:60px;border-radius:50%;border:none;background:#2f6fed;color:#fff;cursor:pointer}
button.mic.on{background:#e5484d;animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
select{font-size:16px;padding:8px;border-radius:10px;border:1px solid #ddd;margin-top:16px}
.out{font-size:40px;font-weight:700;margin:18px 0 6px}.meta{color:#888;font-size:13px}
.heard{color:#555;font-size:14px;min-height:18px;margin-top:8px}
.lang{font-size:13px;margin-top:10px;color:#666}
</style></head><body><div class="card">
<h1>🇲🇽 Peso Converter</h1><div class="sub">Type or tap the mic and say an amount in pesos.</div>
<div class="row"><input id="amt" type="text" inputmode="decimal" placeholder="0 MXN" autofocus><button class="mic" id="mic" title="Speak">🎤</button></div>
<div class="heard" id="heard"></div>
<select id="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>JPY</option><option>COP</option></select>
<div class="out" id="out">—</div><div class="meta" id="meta">Loading live rates…</div>
<div class="lang">Voice language: <select id="vl" style="margin:0;font-size:13px;padding:4px"><option value="en-US">English</option><option value="es-MX">Español</option></select></div>
</div><script>
let rates=null,stamp='';const $=id=>document.getElementById(id);
async function load(){try{const r=await fetch('https://open.er-api.com/v6/latest/MXN');const j=await r.json();rates=j.rates;stamp=new Date(j.time_last_update_unix*1000).toLocaleString();}catch(e){$('meta').textContent='Could not load rates, check your connection.';return}render()}
function render(){if(!rates)return;const c=$('cur').value,v=parseFloat($('amt').value.replace(/[^0-9.]/g,''));const rate=rates[c];
$('meta').textContent=`1 MXN = ${rate.toFixed(4)} ${c} · 1 ${c} = ${(1/rate).toFixed(2)} MXN · updated ${stamp}`;
$('out').textContent=isNaN(v)?'—':new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(v*rate)}
const W={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,quinientos:500,setecientos:700,novecientos:900};
function parse(t){t=t.toLowerCase().replace(/(\d),(\d{3})/g,'$1$2');const d=t.match(/\d+(\.\d+)?/g);
let n=null;if(d){n=parseFloat(d[0]);if(/\b(mil|thousand)\b/.test(t)&&n<1000)n*=1000;if(/\b(million|millón|millones)\b/.test(t))n*=1e6;return n}
let tot=0,cur=0,found=false;for(const w of t.split(/[\s-]+/)){if(w in W){cur+=W[w];found=true}else if(w==='hundred'){cur=(cur||1)*100}else if(w==='thousand'||w==='mil'){tot+=(cur||1)*1000;cur=0;found=true}else if(w==='million'||w==='millón'||w==='millones'){tot+=(cur||1)*1e6;cur=0;found=true}}
return found?tot+cur:null}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('mic').onclick=()=>{if(!SR){$('heard').textContent='Voice input needs Chrome, Edge or Safari.';return}
if(rec){rec.stop();return}rec=new SR();rec.lang=$('vl').value;rec.interimResults=false;
rec.onresult=e=>{const t=e.results[0][0].transcript;const n=parse(t);$('heard').textContent=`Heard: “${t}”`;if(n!=null){$('amt').value=n;render()}else $('heard').textContent+=' (no number found)'};
rec.onend=()=>{rec=null;$('mic').classList.remove('on')};rec.onerror=e=>{$('heard').textContent='Mic error: '+e.error};
$('mic').classList.add('on');$('heard').textContent='Listening…';rec.start()};
$('amt').oninput=render;$('cur').onchange=render;load();setInterval(load,10*60*1000);
</script></body></html>
